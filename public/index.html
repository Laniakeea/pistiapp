<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Pisti — Points Keeper</title>
  <meta name="theme-color" content="#123B28">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="update-bar" hidden>
    <span data-t="updateReady">✨ A new version is ready</span>
    <button id="update-btn" data-t="updateBtn">Update</button>
  </div>

  <!-- ============ SETUP ============ -->
  <section id="screen-setup" class="screen">
    <div class="setup-scroll">
      <header class="brand">
        <div class="lang-row">
          <button id="lang-tr" class="lang-btn">TR</button>
          <button id="lang-en" class="lang-btn">EN</button>
        </div>
        <div class="brand-cards" aria-hidden="true"><span class="bc bc-back"></span><span class="bc bc-front">♥</span></div>
        <h1>Pisti</h1>
        <p class="tagline" data-t="tagline">points keeper for table games</p>
      </header>

      <div id="install-banner" class="paper-note" hidden>
        <div class="rn-text">
          <strong data-t="installTitle">Play as an app</strong>
          <span id="install-hint"></span>
        </div>
        <div class="rn-actions">
          <button id="install-btn" class="btn btn-primary" data-t="installBtn">Install</button>
          <button id="install-dismiss" class="btn btn-ghost" aria-label="dismiss">✕</button>
        </div>
      </div>

      <div id="resume-banner" class="paper-note" hidden>
        <div class="rn-text">
          <strong data-t="resumeTitle">Game in progress</strong>
          <span id="resume-desc"></span>
        </div>
        <div class="rn-actions">
          <button id="resume-btn" class="btn btn-primary" data-t="resumeBtn">Resume</button>
          <button id="discard-btn" class="btn btn-ghost" data-t="discardBtn">Discard</button>
        </div>
      </div>

      <div class="paper-form">
        <h2 class="ph" data-t="pickGame">Pick a game</h2>
        <div id="preset-grid" class="preset-grid"></div>

        <div id="custom-editor" hidden>
          <h2 class="ph" data-t="customButtons">Custom bonus buttons</h2>
          <div id="custom-rows"></div>
        </div>

        <h2 class="ph"><span data-t="players">Players</span> <span id="pcount-label" class="pcount"></span></h2>
        <div class="stepper">
          <button id="pminus" class="step-btn" aria-label="fewer players">−</button>
          <div id="pdots" class="pdots"></div>
          <button id="pplus" class="step-btn" aria-label="more players">+</button>
        </div>
        <div id="player-names" class="player-names"></div>

        <h2 class="ph" data-t="rules">Rules</h2>
        <div class="rules-row">
          <label class="field">
            <span data-t="playTo">Play to (points)</span>
            <input id="target-input" type="number" inputmode="numeric" data-tp="noLimit" placeholder="no limit">
          </label>
          <label class="toggle">
            <input id="lowest-wins" type="checkbox">
            <span class="knob"></span>
            <span class="tlabel" data-t="lowestWins">Lowest score wins</span>
          </label>
        </div>

        <button id="start-btn" class="btn btn-start" data-t="startBtn">Deal me in ▸</button>
      </div>

      <div id="history-wrap" hidden>
        <h2 class="ph ph-light" data-t="finishedGames">Finished games</h2>
        <div id="history-list"></div>
      </div>
      <footer class="setup-foot" data-t="footer">made for game night 🂡</footer>
    </div>
  </section>

  <!-- ============ TABLE ============ -->
  <section id="screen-table" class="screen" hidden>
    <div id="table-area">
      <div id="felt">
        <div class="felt-sheen"></div>
        <!-- center score pad, face down -->
        <div id="pad" class="pad">
          <div class="pad-clip"></div>
          <div class="pad-paper">
            <div class="pad-game" id="pad-game"></div>
            <div class="pad-round" data-t="roundLabel">ROUND</div>
            <div class="pad-round-num" id="pad-round-num">1</div>
            <div class="pad-progress" id="pad-progress"></div>
          </div>
          <div class="pad-pencil" aria-hidden="true">✏️</div>
        </div>
        <button id="commit-round" class="btn btn-commit" hidden data-t="commitRound">Score round ✓</button>
      </div>
      <div id="seats"></div>
    </div>
    <div class="table-controls">
      <button id="home-btn" class="tc-btn" title="back to setup">☰</button>
      <button id="peek-btn" class="tc-btn" title="hold to peek totals">👁</button>
      <button id="finish-btn" class="tc-btn tc-finish" data-t="finishBtn">🏁 Finish</button>
    </div>
    <div id="peek-sheet" class="peek-sheet" hidden></div>
    <div id="round-stamp" class="round-stamp" hidden></div>
  </section>

  <!-- ============ CALCULATOR ============ -->
  <div id="calc-overlay" hidden>
    <div id="calc" class="calc">
      <div class="calc-head">
        <span id="calc-player" class="calc-player"></span>
        <span class="calc-head-btns">
          <button id="calc-rename" class="calc-close" aria-label="rename player" title="rename player">✏️</button>
          <button id="calc-close" class="calc-close" aria-label="close">✕</button>
        </span>
      </div>
      <div class="lcd">
        <div id="lcd-tape" class="lcd-tape"></div>
        <div id="lcd-total" class="lcd-total">0</div>
      </div>
      <div id="quick-row" class="quick-row"></div>
      <div class="keypad">
        <button class="key" data-d="7">7</button>
        <button class="key" data-d="8">8</button>
        <button class="key" data-d="9">9</button>
        <button class="key key-fn" data-op="clear">C</button>
        <button class="key" data-d="4">4</button>
        <button class="key" data-d="5">5</button>
        <button class="key" data-d="6">6</button>
        <button class="key key-fn" data-op="back">⌫</button>
        <button class="key" data-d="1">1</button>
        <button class="key" data-d="2">2</button>
        <button class="key" data-d="3">3</button>
        <button class="key key-fn" data-op="plus">+</button>
        <button class="key key-fn" data-op="neg">±</button>
        <button class="key" data-d="0">0</button>
        <button class="key key-ok" data-op="ok" id="calc-ok">OK</button>
      </div>
    </div>
  </div>

  <!-- ============ REVEAL ============ -->
  <section id="screen-reveal" class="screen" hidden>
    <canvas id="confetti"></canvas>
    <div class="reveal-scroll">
      <div id="winner-banner" class="winner-banner">
        <div class="wb-trophy">🏆</div>
        <div class="wb-name" id="winner-name"></div>
        <div class="wb-sub" id="winner-sub"></div>
      </div>
      <div id="reveal-paper" class="reveal-paper">
        <div class="rp-title" id="rp-title"></div>
        <div class="rp-table-wrap">
          <table id="score-table"></table>
        </div>
      </div>
      <div class="reveal-actions">
        <button id="rematch-btn" class="btn btn-primary" data-t="rematch">Rematch 🔁</button>
        <button id="new-game-btn" class="btn btn-ghost" data-t="newGame">New game</button>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
